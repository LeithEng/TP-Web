<div class="container-fluid">
  <div class="row mb-3">
    <div class="col">
      <div class="alert alert-warning">
        {{ date | date : "full" | uppercase }}
      </div>
      @if (hasCvs()) {
      <div class="alert alert-info">
        <strong>Statistiques:</strong> {{ cvsCount() }} CV(s) | Âge moyen:
        {{ averageAge() }} ans
      </div>
      } @else {
      <div class="alert alert-warning">Aucun CV disponible pour le moment</div>
      }
    </div>
  </div>

  <div class="row">
    <div class="col">
      <app-list [cvs]="cvs()"></app-list>
    </div>
    <div class="col">
      @if (hasSelectedCv()) {
      <router-outlet></router-outlet>
      } @else {
      <div class="alert alert-secondary text-center">
        <i class="fa fa-hand-pointer-o fa-3x mb-3"></i>
        <p>Sélectionnez un CV pour voir les détails</p>
      </div>
      }
    </div>
  </div>
</div>
<app-embauche></app-embauche>
